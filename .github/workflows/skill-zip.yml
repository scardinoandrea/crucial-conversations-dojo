name: Publish skill zip

# Zips plugin/skills/dojo into dojo-skill.zip (folder at zip root, as claude.ai
# skill upload expects) and attaches it to the rolling "skill-latest" release,
# so install.html can link one stable URL:
# https://github.com/scardinoandrea/crucial-conversations-dojo/releases/download/skill-latest/dojo-skill.zip
on:
  push:
    branches: [main]
    paths: ['plugin/skills/dojo/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skill-zip
  cancel-in-progress: true

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: cd plugin/skills && zip -r "$GITHUB_WORKSPACE/dojo-skill.zip" dojo

      - name: Publish to skill-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view skill-latest >/dev/null 2>&1; then
            gh release upload skill-latest dojo-skill.zip --clobber
          else
            gh release create skill-latest dojo-skill.zip \
              --title "Dojo skill (latest)" \
              --notes "Auto-built from plugin/skills/dojo on every change to main. Upload dojo-skill.zip in Claude settings to use the dojo solo." \
              --latest
          fi
